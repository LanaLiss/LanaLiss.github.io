<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проверка безопасности перед переходом</title>
    <!-- Подключаем скрипт Yandex SmartCaptcha -->
    <script src="https://yandexcloud.net" defer></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #1a1a2e url('fon.png') no-repeat center center / cover;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: 0;
        }

        .card {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            padding: 36px 28px;
            border-radius: 16px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
            max-width: 420px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 22px;
            color: #111827;
            margin-bottom: 10px;
        }

        p {
            font-size: 15px;
            color: #4b5563;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .captcha-wrapper {
            display: flex;
            justify-content: center;
            min-height: 100px;
            margin-bottom: 16px;
        }

        .status {
            font-size: 13px;
            color: #6b7280;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Подтвердите, что вы человек</h1>
        <p>Пройдите быструю проверку безопасности, чтобы перейти на целевой сайт.</p>
        
        <div class="captcha-wrapper">
            <!-- НАСТРОЙКА 1: Вставьте ваш Ключ клиента из Яндекс Cloud вместо ВАШ_КЛЮЧ_КЛИЕНТА -->
            <div id="captcha-container"
                 class="smart-captcha"
                 data-sitekey="ysc1_ZLMt8lVR8oyMADzM4zMQBZaasZeHsOjK0uezTF7Oce819fb0"
                 data-callback="onCaptchaSuccess">
            </div>
        </div>

        <div class="status" id="status-text">Ожидание проверки...</div>
    </div>

    <script>
        // НАСТРОЙКА 2: Вставьте ссылку на сайт, куда нужно перенаправить пользователя
        const TARGET_URL = "https://lnk.bio/LanaLiss";

        function onCaptchaSuccess(token) {
            const status = document.getElementById("status-text");
            status.style.color = "#059669";
            status.textContent = "Проверка пройдена! Перенаправляем...";
            
            setTimeout(() => {
                window.location.href = TARGET_URL;
            }, 800);
        }
    </script>

</body>
</html>
