<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проверка безопасности перед переходом</title>
    <!-- Подключаем скрипт Cloudflare Turnstile -->
    <script src="https://cloudflare.com" async defer></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            /* НАСТРОЙКА 1: Вставьте ссылку на вашу фоновую картинку ниже */
            background: #1a1a2e url('fon.png') no-repeat center center / cover;
        }

        /* Затемнение фона, чтобы текст хорошо читался */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            z-index: 0;
        }

        .card {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            padding: 36px 28px;
            border-radius: 16px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.25);
            max-width: 420px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 22px;
            color: #111827;
            margin-bottom: 10px;
        }

        p {
            font-size: 15px;
            color: #4b5563;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .captcha-wrapper {
            display: flex;
            justify-content: center;
            min-height: 65px;
            margin-bottom: 16px;
        }

        .status {
            font-size: 13px;
            color: #6b7280;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Подтвердите, что вы человек</h1>
        <p>Пройдите быструю проверку безопасности, чтобы перейти на целевой сайт.</p>
        
        <div class="captcha-wrapper">
            <!-- НАСТРОЙКА 2: Замените ВАШ_SITE_KEY на ключ из панели Cloudflare -->
            <div class="cf-turnstile" 
                 data-sitekey="0x4AAAAAAF915Lh24hSSH2uJ" 
                 data-callback="onCaptchaSuccess"
                 data-theme="light">
            </div>
        </div>

        <div class="status" id="status-text">Ожидание проверки...</div>
    </div>

    <script>
        // НАСТРОЙКА 3: Вставьте ссылку на сайт, куда нужно перенаправить пользователя
        const TARGET_URL = "https://lnk.bio/LanaLiss";

        function onCaptchaSuccess(token) {
            const status = document.getElementById("status-text");
            status.style.color = "#059669";
            status.textContent = "Проверка пройдена! Перенаправляем...";
            
            // Небольшая задержка (0.8 сек), чтобы пользователь увидел галочку успеха
            setTimeout(() => {
                window.location.href = TARGET_URL;
            }, 800);
        }
    </script>

</body>
</html>
